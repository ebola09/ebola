<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ebola arcade</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="../assets/favicon.png">

<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">

<script src="../js/themes.js"></script>

<style>
/* prevents flash before partials load */
body { visibility: hidden; }
</style>
</head>

<body>

<div id="topbar-placeholder"></div>

<div class="main-content">
    <div class="games-container">

        <div class="grid-section">
            <h2 class="grid-title">recently played</h2>
            <div id="recentlyPlayedGrid"></div>
        </div>

        <div class="grid-section">
            <div class="grid-title-container">
                <h2 class="grid-title">all games</h2>
                <input type="text" id="gameSearch" class="search-input" placeholder="search">
            </div>
            <div id="gameGrid"></div>
        </div>

    </div>
</div>

<div id="bottombar-placeholder"></div>
<div id="settingsPanel"></div>

<script>
/* ---------------- PARTIALS ---------------- */

async function loadPartials() {
    const [topbar, bottombar, settings] = await Promise.all([
        fetch("../partials/topbar.html").then(r => r.text()),
        fetch("../partials/bottombar.html").then(r => r.text()),
        fetch("../partials/settings.html").then(r => r.text())
    ]);

    document.getElementById("topbar-placeholder").innerHTML = topbar;
    document.getElementById("bottombar-placeholder").innerHTML = bottombar;
    document.getElementById("settingsPanel").innerHTML = settings;

    document.body.style.visibility = "visible";

    initApp();
}

/* ---------------- SECRET TREE ---------------- */

const sequence = ["t","r","e","e"];
let seqIndex = 0;

document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === sequence[seqIndex]) {
        seqIndex++;
        if (seqIndex === sequence.length) window.location.href = "tree.html";
    } else {
        seqIndex = 0;
    }
});

/* ---------------- COOKIES ---------------- */

function getCookie(name) {
    const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
    return match ? match[2] : null;
}

function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days * 86400000).toUTCString();
    document.cookie = `${name}=${value}; expires=${expires}; path=/`;
}

/* ---------------- APP ---------------- */

function initApp() {

    const gameGrid = document.getElementById("gameGrid");
    const recentGrid = document.getElementById("recentlyPlayedGrid");
    const searchInput = document.getElementById("gameSearch");

    const settingsButton = document.getElementById("settingsButton");
    const settingsPanel = document.querySelector(".settings-panel");
    const themeSelect = document.getElementById("themeSelect");

    /* ---- Settings button fix ---- */
    if (settingsButton && settingsPanel) {
        settingsButton.onclick = () => {
            const open = settingsPanel.style.display === "block";
            settingsPanel.style.display = open ? "none" : "block";
            settingsButton.classList.toggle("settings-open", !open);
        };
    }

    /* ---- Theme ---- */
    const savedTheme = getCookie("theme") || "orange";
    setTheme(savedTheme);
    themeSelect.value = savedTheme;

    themeSelect.onchange = () => {
        setTheme(themeSelect.value);
        setCookie("theme", themeSelect.value, 30);
    };

    /* ---- Recently Played ---- */
    function getRecent() {
        return JSON.parse(getCookie("recent") || "[]");
    }

    function saveRecent(list) {
        setCookie("recent", JSON.stringify(list), 30);
    }

    function addRecent(game) {
        let list = getRecent().filter(g => g.name !== game.name);
        list.unshift(game);
        list = list.slice(0, 5);
        saveRecent(list);
        renderRecent(list);
    }

    function renderRecent(list) {
        recentGrid.innerHTML = "";
        if (!list.length) {
            recentGrid.innerHTML = "<p style='color:var(--link-color)'>no games yet</p>";
            return;
        }
        list.forEach(g => {
            const a = document.createElement("a");
            a.href = g.path;
            a.className = "card";
            a.style.backgroundImage = `url('${g.thumbnail}')`;
            recentGrid.appendChild(a);
        });
    }

    /* ---- Favorites ---- */
    function getFavs() {
        return JSON.parse(getCookie("favs") || "[]");
    }

    function saveFavs(f) {
        setCookie("favs", JSON.stringify(f), 30);
    }

    function isFav(game) {
        return getFavs().some(f => f.name === game.name);
    }

    function toggleFav(game) {
        let favs = getFavs();
        favs = isFav(game)
            ? favs.filter(f => f.name !== game.name)
            : [...favs, game];
        saveFavs(favs);
        renderGames(allGames);
    }

    /* ---- Render Games ---- */
    function renderGames(list) {
        gameGrid.innerHTML = "";
        list.forEach(game => {
            const card = document.createElement("a");
            card.href = game.path;
            card.className = "card";
            if (isFav(game)) card.classList.add("favorited");
            card.style.backgroundImage = `url('${game.thumbnail}')`;

            card.onclick = () => addRecent(game);

            const star = document.createElement("div");
            star.className = "favorite-badge";
            star.textContent = isFav(game) ? "★" : "☆";
            star.onclick = e => {
                e.preventDefault();
                e.stopPropagation();
                toggleFav(game);
            };

            card.appendChild(star);
            gameGrid.appendChild(card);
        });
    }

    /* ---- Load games ---- */
    let allGames = [];

    fetch("gameList.json")
        .then(r => r.json())
        .then(data => {
            allGames = data.games || [];
            renderGames(allGames);
        });

    searchInput.oninput = () => {
        const q = searchInput.value.toLowerCase();
        renderGames(allGames.filter(g =>
            g.name.toLowerCase().includes(q) ||
            g.tags?.some(t => t.toLowerCase().includes(q))
        ));
    };

    renderRecent(getRecent());
}

loadPartials();
</script>

</body>
</html>
