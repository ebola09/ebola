<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ebola arcade</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">

<script src="../js/themes.js"></script>

<script>
async function loadPartials() {
    try {
        const [topbar, bottombar, settings] = await Promise.all([
            fetch('../partials/topbar.html').then(r => r.text()),
            fetch('../partials/bottombar.html').then(r => r.text()),
            fetch('../partials/settings.html').then(r => r.text())
        ]);

        document.getElementById('topbar-placeholder').innerHTML = topbar;
        document.getElementById('bottombar-placeholder').innerHTML = bottombar;
        document.getElementById('settingsPanel').innerHTML = settings;

        initApp();
    } catch (err) {
        console.error(err);
    }
}
loadPartials();
</script>
</head>

<script>
const sequence = ['t','r','e','e'];
let i = 0;
document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === sequence[i]) {
        i++;
        if (i === sequence.length) window.location.href = "tree.html";
    } else i = 0;
});
</script>

<body>

<div id="topbar-placeholder"></div>

<div class="main-content">
    <div class="games-container">

        <div class="grid-section">
            <h2 class="grid-title">recently played</h2>
            <div id="recentlyPlayedGrid"></div>
        </div>

        <div class="grid-section">
            <div class="grid-title-container">
                <h2 class="grid-title">all games</h2>
                <input type="text" id="gameSearch" class="search-input" placeholder="search">
            </div>
            <div id="gameGrid"></div>
        </div>

    </div>
</div>

<div id="bottombar-placeholder"></div>
<div id="settingsPanel"></div>

<script>
function initApp() {

const MAX_RECENT = 5;
const recentlyPlayedGrid = document.getElementById("recentlyPlayedGrid");
const gameGrid = document.getElementById("gameGrid");
const gameSearch = document.getElementById("gameSearch");
const themeSelect = document.getElementById("themeSelect");
const settingsButton = document.getElementById("settingsButton");
const settingsPanel = document.querySelector(".settings-panel");

let allGames = [];

/* ---------------- Cookies ---------------- */

function getCookie(n){return document.cookie.split("; ").find(r=>r.startsWith(n+"="))?.split("=")[1]||null;}
function setCookie(n,v,d){
    let e="";
    if(d){const t=new Date();t.setTime(t.getTime()+d*86400000);e="; expires="+t.toUTCString();}
    document.cookie=n+"="+v+e+"; path=/";
}

/* ------------- Recently Played ------------- */

function getRecent(){ try{ return JSON.parse(getCookie("recentlyPlayed")||"[]"); }catch{return[];} }
function saveRecent(r){ setCookie("recentlyPlayed",JSON.stringify(r),30); }

function updateRecent(){
    const r=getRecent();
    recentlyPlayedGrid.innerHTML="";
    if(!r.length){
        recentlyPlayedGrid.innerHTML="<p style='color:var(--link-color)'>no games played yet</p>";
        return;
    }
    r.forEach(g=>{
        const a=document.createElement("a");
        a.href=g.path;
        a.className="card";
        a.style.backgroundImage=`url('${g.thumbnail||""}')`;
        a.dataset.title=g.name;
        recentlyPlayedGrid.appendChild(a);
    });
}

function addRecent(game){
    let r=getRecent().filter(g=>g.name!==game.name);
    r.unshift(game);
    if(r.length>MAX_RECENT) r.pop();
    saveRecent(r);
    updateRecent();
}

/* -------------- Favorites -------------- */

function getFav(){ try{return JSON.parse(getCookie("favorites")||"[]");}catch{return[];} }
function saveFav(f){ setCookie("favorites",JSON.stringify(f),30); }
function isFav(g){ return getFav().some(f=>f.name===g.name); }

function toggleFav(g){
    let f=getFav();
    isFav(g)?f=f.filter(x=>x.name!==g.name):f.push(g);
    saveFav(f);
    displayGames(sortGames(allGames));
}

/* -------------- Game Grid -------------- */

function sortGames(g){
    return g.sort((a,b)=>{
        if(isFav(a)&&!isFav(b)) return -1;
        if(!isFav(a)&&isFav(b)) return 1;
        return a.name.localeCompare(b.name);
    });
}

function displayGames(games){
    gameGrid.innerHTML="";
    games.forEach(g=>{
        const a=document.createElement("a");
        a.href=g.path;
        a.className="card";
        if(isFav(g)) a.classList.add("favorited");
        a.style.backgroundImage=`url('${g.thumbnail||""}')`;
        a.dataset.title=g.name;
        a.onclick=()=>addRecent(g);

        const fav=document.createElement("div");
        fav.className="favorite-badge";
        fav.textContent=isFav(g)?"★":"☆";
        fav.onclick=e=>{
            e.preventDefault();
            e.stopPropagation();
            toggleFav(g);
        };
        a.appendChild(fav);

        if(g.tags?.includes("new")){
            const n=document.createElement("div");
            n.className="new-badge";
            n.textContent="new";
            a.appendChild(n);
        }

        gameGrid.appendChild(a);
    });
}

/* -------------- Load Games -------------- */

fetch("gameList.json")
.then(r=>r.json())
.then(d=>{
    allGames = sortGames(d.games||[]);
    displayGames(allGames);
})
.catch(()=> gameGrid.innerHTML="<p style='color:var(--link-color)'>failed to load games</p>");

/* -------------- Search -------------- */

gameSearch.addEventListener("input",()=>{
    const q=gameSearch.value.toLowerCase();
    const f=allGames.filter(g=>
        g.name.toLowerCase().includes(q) ||
        g.tags?.some(t=>t.toLowerCase().includes(q))
    );
    displayGames(sortGames(f));
});

updateRecent();
}
</script>

</body>
</html>
