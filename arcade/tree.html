<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>tree</title>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'IBM Plex Mono', monospace;
            padding: 20px;
            background-color: #000;
        }
        ul {
            list-style: none;
            padding-left: 0;
        }
        li {
            margin: 6px 0;
        }
        a {
            color: #00ff1a;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<ul id="file-list"></ul>

<script>
const fileList = document.getElementById("file-list");

// GitHub repo info
const owner = "ebola09";
const repo = "ebola";
const branch = "main";      // change to "master" if needed
const githubFolder = "games";

// Where the games actually live on your site
const siteFolder = "/arcade/games";

const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${githubFolder}?ref=${branch}`;

async function fetchFiles() {
    try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("GitHub API error");

        const items = await res.json();

        items.forEach(item => {
            if (item.type === "file" && item.name.endsWith(".html")) {
                const li = document.createElement("li");
                const link = document.createElement("a");

                link.textContent = item.name;

                // Correct site path
                link.href = `${siteFolder}/${item.name}`;

                li.appendChild(link);
                fileList.appendChild(li);
            }
        });

    } catch (err) {
        console.error(err);
        fileList.textContent = "Failed to load files.";
    }
}

fetchFiles();
</script>

</body>
</html>
